# Build + release Reminder Desktop (Tauri v2) when a desktop-v<x.y.z> tag is pushed.
#
# This repo is PUBLIC, so GitHub Actions minutes are unlimited (macOS runners included), and the
# release is created in this very repo with the default GITHUB_TOKEN - no cross-repo token needed.
#
# Required secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of .tauri/reminder.key (do NOT commit that file)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  leave empty if the key has no password
#
# macOS signing: AD-HOC by default (APPLE_SIGNING_IDENTITY = '-'). Without signing the .app bundle
# has no Contents/_CodeSignature and Apple Silicon machines report "damaged and can't be opened"
# (this really happened in desktop-v1.0.0). With an Apple Developer Program account, add the 3
# secrets APPLE_SIGNING_IDENTITY, APPLE_CERTIFICATE (.p12 base64) and APPLE_CERTIFICATE_PASSWORD
# to sign for real and notarize.

name: Release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the release ONCE before building. If all 3 runners create it themselves, the slow one
  # gets a 422 already_exists and fails (this really happened in desktop-v1.0.1).
  create-release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.get_or_create.outputs.result }}
    steps:
      - name: Get or create release
        id: get_or_create
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.GITHUB_REF_NAME;
            try {
              const found = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info('Reusing the existing release: ' + found.data.html_url);
              return String(found.data.id);
            } catch (err) {
              if (err.status !== 404) throw err;
            }
            const body = [
              'Download the installer from the Assets section below.',
              '',
              '- Windows 10/11: `Reminder_x.y.z_x64-setup.exe`',
              '- macOS Apple Silicon (M1 and newer): `Reminder_x.y.z_aarch64.dmg`',
              '- macOS Intel: `Reminder_x.y.z_x64.dmg`',
              '',
              'The app checks for new versions and updates itself. The `latest.json` and `.sig` files',
              'are there for the updater, you do not need to download them.',
            ].join('\n');
            const created = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: 'Reminder Desktop ' + tag, body,
              draft: false, prerelease: false,
            });
            core.info('Created the release: ' + created.data.html_url);
            return String(created.data.id);

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_targets: 'x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Check tag matches tauri.conf.json version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          CONF_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#desktop-v}"
          echo "tauri.conf.json=$CONF_VERSION tag=$TAG_VERSION"
          if [ "$CONF_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag desktop-v$TAG_VERSION does not match version $CONF_VERSION in src-tauri/tauri.conf.json"
            exit 1
          fi

      # Only export the certificate variables when they really exist. Setting them to an empty string
      # still makes tauri-cli run `security import` and fail (this happened in desktop-v1.0.1).
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          echo "APPLE_SIGNING_IDENTITY=${IDENTITY:--}" >> "$GITHUB_ENV"
          if [ -n "$CERT" ]; then
            {
              echo "APPLE_CERTIFICATE<<__CERT_EOF__"
              echo "$CERT"
              echo "__CERT_EOF__"
              echo "APPLE_CERTIFICATE_PASSWORD<<__PW_EOF__"
              echo "$CERT_PASSWORD"
              echo "__PW_EOF__"
            } >> "$GITHUB_ENV"
            echo "Signing with the Developer ID certificate."
          else
            echo "No APPLE_CERTIFICATE -> ad-hoc signing (identity '-')."
          fi

      - name: Build only (manual run, no release)
        if: "!startsWith(github.ref, 'refs/tags/desktop-v')"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build -- ${{ matrix.args }}

      - name: Build and upload to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
